
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
</head>
<body>
    <h1>Kalkulator Nilai Mahasiswa</h1>

    <form id="formNilai">
        <label for="tugas">Nilai Tugas:</label>
        <input type="number" id="tugas" min="0" max="100" required>
        <br><br>

        <label for="uts">Nilai UTS:</label>
        <input type="number" id="uts" min="0" max="100" required>
        <br><br>

        <label for="uas">Nilai UAS:</label>
        <input type="number" id="uas" min="0" max="100" required>
        <br><br>

        <button type="submit">Hitung Nilai</button>
    </form>

    <div id="hasil"></div>

    <script src="mini-project.js"></script>
</body>
</html>
